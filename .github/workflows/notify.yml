# Hourly sender of reminders (spec 8.15). It calls the app, which decides who gets what (at most 1 a day, never 22h-7h, only the chosen hour).
# Needs the repository secret CRON_SECRET (the same value as the CRON_SECRET variable in Vercel).
name: notify
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sender
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set: nothing to do"; exit 0; fi
          curl -fsS -X POST -H "x-cron-secret: $CRON_SECRET" --max-time 55 "https://professor-filipe.vercel.app/api/v1/study/notify-tick"
