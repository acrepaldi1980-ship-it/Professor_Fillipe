# Daily backup of user data (RNF-12): 30-day retention as a private workflow artifact, then a restore test.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase account token); the project ref is not secret.
name: backup
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: hltyhkydytetdatgyvux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/backup.mjs backup backups
      - name: Restore test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/backup.mjs restore-test "$(ls backups/*.json.gz | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: pf-backup
          path: backups/*.json.gz
          retention-days: 30
